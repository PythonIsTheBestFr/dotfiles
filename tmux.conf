# ==============================================================================
# TMUX CONFIGURATION (ALT+A PREFIX)
# ==============================================================================

# --- 1. PREFIX SETTINGS ---
# Set prefix to Alt-a
unbind C-a
set -g prefix C-Space
bind C-Space send-prefix

# --- 2. SENSIBLE DEFAULTS ---
set -s escape-time 0           # No delay for escape key (great for Vim)
set -g history-limit 50000     # Increase scrollback buffer
set -g display-time 4000       # Status messages stay for 4 seconds
set -g status-interval 5       # Refresh status line more often
set -g focus-events on         # Let apps inside tmux know when they have focus
set -w -g xterm-keys on        # Support for xterm keys
set -g status-position top

# --- 3. DISPLAY & COLORS ---
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc" # Enable TrueColor support
set -g base-index 1            # Start windows at 1
setw -g pane-base-index 1      # Start panes at 1
set -g renumber-windows on     # Automatically renumber windows when one is closed

# --- 4. NAVIGATION (NO PREFIX NEEDED) ---
# Switch panes using Alt-arrow keys
bind -n M-a select-pane -L
bind -n M-d select-pane -R
bind -n M-w select-pane -U
bind -n M-s select-pane -D

# Switch windows using Alt-h/l)
bind -n M-z previous-window
bind -n M-c next-window

# --- 5. SPLITS & UTILS (PREFIX REQUIRED) ---
# Easier splitting with Prefix + | or -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
unbind c 
bind -n M-v new-window
# Kill the current window with Alt + Shift + X
bind -n M-x kill-pane
bind x kill-window
# Kill the entire session with Alt + Shift + Q
bind -n M-q kill-session

# Quick reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

# --- 6. MOUSE & INTERACTION ---
set -g mouse on
# Use Alt-m to toggle mouse mode on the fly
bind -n M-m set-option -g mouse \; display "Mouse: #{?mouse,ON,OFF}"

# --- 7. PLUGIN MANAGER (TPM) ---
# Note: Requires git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'  # Persist sessions
set -g @plugin 'catppuccin/tmux'             # Modern Theme

# Catppuccin Theme Config
set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory user host session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

# Initialize TPM (Keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'